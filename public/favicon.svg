<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a121d"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Main Outer Sphere Network Gradient (Teal to Blue) -->
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30ebd2"/>
      <stop offset="50%" stop-color="#00a3e0"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>

    <!-- Arrow Pointer Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0080ff"/>
      <stop offset="70%" stop-color="#00d2b4"/>
      <stop offset="100%" stop-color="#32f2b2"/>
    </linearGradient>

    <!-- Glowing Nodes Gradient Filters/Gradients -->
    <radialGradient id="nodeGlowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7effeb"/>
      <stop offset="40%" stop-color="#30ebd2"/>
      <stop offset="100%" stop-color="#148070" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80d8ff"/>
      <stop offset="40%" stop-color="#0099ff"/>
      <stop offset="100%" stop-color="#004488" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Main IoT Network Graphic Group -->
  <g transform="translate(0, 0)">

    <!-- BACK GRID / GLOBE LINES (Darker, behind) -->
    <g stroke="url(#netGrad)" stroke-width="6" fill="none" opacity="0.85" stroke-linecap="round" stroke-linejoin="round">
      
      <!-- Outer Hexagonal Boundary / Latitude Ring -->
      <polygon points="
        400,120 
        590,200 
        670,400 
        590,600 
        400,680 
        210,600 
        130,400 
        210,200" 
        stroke-width="10"/>

      <!-- Inner Spherical Curvature Ellipses / Longitudes -->
      <!-- Vertical Ellipses -->
      <ellipse cx="400" cy="400" rx="270" ry="270" stroke-width="8"/>
      <ellipse cx="400" cy="400" rx="180" ry="270" stroke-width="6"/>
      <ellipse cx="400" cy="400" rx="90" ry="270" stroke-width="5"/>

      <!-- Horizontal Latitudes -->
      <ellipse cx="400" cy="400" rx="270" ry="180" stroke-width="6"/>
      <ellipse cx="400" cy="400" rx="270" ry="90" stroke-width="5"/>

      <!-- Diagonal Connecting Arcs / Network Web Structure -->
      <!-- Top Left Diagonal Spoke -->
      <path d="M 400,120 L 290,280 L 130,400" stroke-width="7"/>
      <!-- Top Right Diagonal Spoke -->
      <path d="M 400,120 L 510,280 L 670,400" stroke-width="7"/>
      <!-- Bottom Left Diagonal Spoke -->
      <path d="M 130,400 L 290,520 L 400,680" stroke-width="7"/>
      <!-- Bottom Right Diagonal Spoke -->
      <path d="M 670,400 L 510,520 L 400,680" stroke-width="7"/>

      <!-- Cross/Radial Spoke Connectors to Center -->
      <line x1="400" y1="120" x2="400" y2="280" stroke-width="7"/>
      <line x1="670" y1="400" x2="520" y2="400" stroke-width="7"/>
      <line x1="400" y1="680" x2="400" y2="520" stroke-width="7"/>
      <line x1="130" y1="400" x2="280" y2="400" stroke-width="7"/>

      <line x1="210" y1="200" x2="320" y2="310" stroke-width="7"/>
      <line x1="590" y1="200" x2="480" y2="310" stroke-width="7"/>
      <line x1="210" y1="600" x2="310" y2="490" stroke-width="7"/>
      <line x1="590" y1="600" x2="490" y2="490" stroke-width="7"/>
    </g>

    <!-- CENTER DIAL & ARROW ASSEMBLY -->
    <g>
      <!-- Center Concentric Tech Rings -->
      <circle cx="400" cy="400" r="110" fill="none" stroke="#003355" stroke-width="12" opacity="0.6"/>
      <circle cx="400" cy="400" r="95" fill="none" stroke="#00a3e0" stroke-width="5" stroke-dasharray="20 10 5 10" opacity="0.8"/>
      <circle cx="400" cy="400" r="75" fill="none" stroke="#00d2b4" stroke-width="4"/>

      <!-- Thick Directional Arrow (Pointing Top-Right towards 2 o'clock) -->
      <path d="M 330,470 
               L 470,330 
               L 450,310 
               L 550,250 
               L 490,350 
               L 470,330 
               L 330,470 Z" 
            fill="url(#arrowGrad)" filter="url(#glow)"/>

      <!-- Main Central Hub Circle -->
      <circle cx="400" cy="400" r="45" fill="#007799" stroke="#00f2c3" stroke-width="6"/>
      <circle cx="400" cy="400" r="22" fill="#80ffea" filter="url(#glow)"/>
    </g>

    <!-- OUTER CORNER & PERIMETER GLOWING NODES (8 Main Outer Vertices) -->
    <!-- Top Node -->
    <circle cx="400" cy="120" r="28" fill="url(#nodeGlowTeal)" filter="url(#strongGlow)"/>
    <circle cx="400" cy="120" r="14" fill="#a6fff2"/>

    <!-- Top Right Node -->
    <circle cx="590" cy="200" r="28" fill="url(#nodeGlowTeal)" filter="url(#strongGlow)"/>
    <circle cx="590" cy="200" r="14" fill="#a6fff2"/>

    <!-- Right Node -->
    <circle cx="670" cy="400" r="28" fill="url(#nodeGlowTeal)" filter="url(#strongGlow)"/>
    <circle cx="670" cy="400" r="14" fill="#a6fff2"/>

    <!-- Bottom Right Node -->
    <circle cx="590" cy="600" r="28" fill="url(#nodeGlowTeal)" filter="url(#strongGlow)"/>
    <circle cx="590" cy="600" r="14" fill="#a6fff2"/>

    <!-- Bottom Node -->
    <circle cx="400" cy="680" r="28" fill="url(#nodeGlowBlue)" filter="url(#strongGlow)"/>
    <circle cx="400" cy="680" r="14" fill="#80d8ff"/>

    <!-- Bottom Left Node -->
    <circle cx="210" cy="600" r="28" fill="url(#nodeGlowBlue)" filter="url(#strongGlow)"/>
    <circle cx="210" cy="600" r="14" fill="#80d8ff"/>

    <!-- Left Node -->
    <circle cx="130" cy="400" r="28" fill="url(#nodeGlowBlue)" filter="url(#strongGlow)"/>
    <circle cx="130" cy="400" r="14" fill="#80d8ff"/>

    <!-- Top Left Node -->
    <circle cx="210" cy="200" r="28" fill="url(#nodeGlowBlue)" filter="url(#strongGlow)"/>
    <circle cx="210" cy="200" r="14" fill="#80d8ff"/>


    <!-- IOT SMART ICONS & INNER SATELLITE NODES -->

    <!-- 1. SMART HOME (Top / 12 o'clock) -->
    <g transform="translate(400, 240)">
      <circle cx="0" cy="0" r="32" fill="#009999" stroke="#30ebd2" stroke-width="3"/>
      <!-- Home Icon -->
      <path d="M -14,4 L 0,-10 L 14,4 L 14,12 C 14,14 12,15 10,15 L -10,15 C -12,15 -14,14 -14,12 Z" fill="#ffffff"/>
      <path d="M -4,15 L -4,7 L 4,7 L 4,15 Z" fill="#009999"/>
    </g>

    <!-- 2. WI-FI / SIGNAL (Right / 2 o'clock) -->
    <g transform="translate(550, 310)">
      <circle cx="0" cy="0" r="32" fill="#0088b5" stroke="#00d2b4" stroke-width="3"/>
      <!-- Wifi Icon -->
      <path d="M -12,-6 A 18,18 0 0,1 12,-6" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M -7,0 A 11,11 0 0,1 7,0" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="0" cy="6" r="3" fill="#ffffff"/>
    </g>

    <!-- 3. SMART CAR / AUTOMOTIVE (Bottom Right / 4 o'clock) -->
    <g transform="translate(510, 490)">
      <circle cx="0" cy="0" r="32" fill="#0077b5" stroke="#00a3e0" stroke-width="3"/>
      <!-- Car Icon -->
      <path d="M -15,2 L -12,-7 C -11,-9 -9,-10 -6,-10 L 6,-10 C 9,-10 11,-9 12,-7 L 15,2 L 16,3 C 17,4 17,7 16,8 L 16,10 C 16,11 15,12 14,12 L 13,12 C 12,12 11,11 11,10 L 11,8 L -11,8 L -11,10 C -11,11 -12,12 -13,12 L -14,12 C -15,12 -16,11 -16,10 L -16,8 C -17,7 -17,4 -16,3 Z" fill="#ffffff"/>
      <circle cx="-10" cy="3" r="2.5" fill="#0077b5"/>
      <circle cx="10" cy="3" r="2.5" fill="#0077b5"/>
      <path d="M -9,-3 L -7,-7 L 7,-7 L 9,-3 Z" fill="#0077b5"/>
    </g>

    <!-- 4. WEARABLE / SMARTWATCH (Bottom / 6 o'clock) -->
    <g transform="translate(400, 560)">
      <circle cx="0" cy="0" r="32" fill="#0055aa" stroke="#0099ff" stroke-width="3"/>
      <!-- Smartwatch Icon -->
      <!-- Straps -->
      <rect x="-7" y="-16" width="14" height="32" rx="3" fill="#ffffff" opacity="0.7"/>
      <!-- Body -->
      <rect x="-11" y="-10" width="22" height="20" rx="5" fill="#ffffff"/>
      <rect x="-8" y="-7" width="16" height="14" rx="2" fill="#0055aa"/>
      <!-- Screen User Icon -->
      <circle cx="0" cy="-2" r="3" fill="#ffffff"/>
      <path d="M -5,4 C -5,1 -2,1 0,1 C 2,1 5,1 5,4 Z" fill="#ffffff"/>
    </g>

    <!-- 5. CLOUD COMPUTING (Bottom Left / 8 o'clock) -->
    <g transform="translate(290, 490)">
      <circle cx="0" cy="0" r="32" fill="#0066cc" stroke="#00a3e0" stroke-width="3"/>
      <!-- Cloud Icon -->
      <path d="M -10,8 L 11,8 C 14.5,8 17,5.5 17,2 C 17,-1 14.8,-3.5 12,-3.9 C 11.3,-7.5 8,-10 4,-10 C 0.5,-10 -2.5,-8.2 -3.7,-5.2 C -4.5,-5.7 -5.5,-6 -6.5,-6 C -9.5,-6 -12,-3.5 -12,-0.5 C -12,0.3 -11.8,1 -11.4,1.7 C -13,-0.5 -15,2 -13,5 C -12,7 -11,8 -10,8 Z" fill="#ffffff"/>
    </g>

    <!-- 6. SETTINGS / GEAR / INDUSTRY (Left / 9 o'clock) -->
    <g transform="translate(240, 320)">
      <circle cx="0" cy="0" r="32" fill="#0088cc" stroke="#00c8d6" stroke-width="3"/>
      <!-- Gear Icon -->
      <path d="M 6,-14 L -6,-14 L -8,-9 L -12,-7 L -16,-11 L -21,-6 L -17,-1 L -17,3 L -21,8 L -16,13 L -12,9 L -8,11 L -6,16 L 6,16 L 8,11 L 12,9 L 16,13 L 21,8 L 17,3 L 17,-1 L 21,-6 L 16,-11 L 12,-7 L 8,-9 Z" fill="#ffffff" transform="scale(0.7)"/>
      <circle cx="0" cy="0" r="5" fill="#0088cc"/>
    </g>

    <!-- 7. TOWER / TOWER TRANSMISSION (Top Left / 10 o'clock) -->
    <g transform="translate(290, 240)">
      <circle cx="0" cy="0" r="32" fill="#00a3a3" stroke="#30ebd2" stroke-width="3"/>
      <!-- Antenna / Tower Icon -->
      <circle cx="0" cy="-8" r="3" fill="#ffffff"/>
      <path d="M -3,-2 L 3,-2 L 7,12 L 4,12 L 0,1 L -4,12 L -7,12 Z" fill="#ffffff"/>
      <path d="M -4,3 L 4,3 M -5,7 L 5,7" stroke="#00a3a3" stroke-width="1.5"/>
      <!-- Waves -->
      <path d="M -7,-12 A 10,10 0 0,1 7,-12" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <path d="M -11,-15 A 15,15 0 0,1 11,-15" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>

  </g>
</svg>
